<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>进入短视频浏览任务</title>
  <link rel="stylesheet" href="src/styles/site.css" />
</head>
<body>
  <main class="site-shell">
    <header class="site-topbar participant-topbar">
      <div class="brand-lockup">
        <strong>短视频浏览任务</strong>
        <span>请根据页面提示完成任务准备。</span>
      </div>
    </header>

    <section class="entry-layout entry-layout--single">
      <form class="entry-card participant-entry-card" id="entryForm">
        <h1>选择你感兴趣的视频类型</h1>
        <p class="entry-instruction" id="experimentInstruction"></p>
        <p>为了生成更接近你日常使用习惯的短视频内容，请先填写姓名并选择 1–3 类你较感兴趣的内容。系统将按固定规则生成浏览序列，并记录你实际分配到的视频类型。</p>

        <div class="form-row">
          <label for="participantName">姓名（必填）</label>
          <input id="participantName" name="participantName" autocomplete="name" placeholder="例如 张三" required />
        </div>

        <div class="category-grid" id="categoryGrid"></div>

        <div class="notice" id="formNotice">姓名必填，且必须选择 1–3 类内容。</div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;">
          <button class="btn btn--primary participant-submit" id="participantSubmit" type="submit" disabled>进入刷视频任务</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
  <script src="src/config/cloudbase.js"></script>
  <script src="src/config/categories.js"></script>
  <script src="src/config/videos.js"></script>
  <script src="src/config/conditions.js"></script>
  <script src="src/lib/store.js"></script>
  <script src="src/lib/recommendation.js"></script>
  <script src="src/tracking/tracking.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const study = (params.get('study') || '1a').toLowerCase();
    const conditionId = (params.get('condition') || 'g1').toLowerCase();
    const participantParam = params.get('name') || '';
    const returnUrl = params.get('returnUrl') || '';
    const source = params.get('source') || 'local_preview';
    const condition = window.findExperimentCondition(study, conditionId);
    const experimentInstruction = document.getElementById('experimentInstruction');

    const categoryGrid = document.getElementById('categoryGrid');
    const form = document.getElementById('entryForm');
    const participantInput = document.getElementById('participantName');
    const notice = document.getElementById('formNotice');

    if (!condition) {
      form.innerHTML = '<h1>实验入口无效</h1><p>当前链接无法启动实验。请返回问卷平台重新进入。</p>';
    } else {
      participantInput.value = participantParam;
      const durationText = study === '2b' ? '十分钟' : '八分钟';
      experimentInstruction.innerHTML = `欢迎参与本次实验。接下来您将观看某一正在测试的短视频平台提供的推荐内容。您的目标是<strong>通过${durationText}左右的短视频浏览进行娱乐与放松</strong>（您可以根据您的使用体验调整浏览时间）。`;
      categoryGrid.innerHTML = window.CONTENT_CATEGORIES.map((category) => `
        <label class="category-option">
          <input type="checkbox" name="category" value="${category.id}" />
          <strong>${category.label}</strong>
          <span>${category.description}</span>
        </label>
      `).join('');
    }

    const submitBtn = document.getElementById('participantSubmit');

    function selectedCategories() {
      return Array.from(form.querySelectorAll('input[name="category"]:checked')).map((item) => item.value);
    }

    function updateFormState() {
      if (!condition || !submitBtn) return;

      const min = condition.recommendation.minSelectedCategories || 1;
      const max = condition.recommendation.maxSelectedCategories || 3;
      const count = selectedCategories().length;

      form.querySelectorAll('input[name="category"]').forEach((input) => {
        input.disabled = count >= max && !input.checked;
      });

      submitBtn.disabled = !(participantInput.value.trim() && count >= min && count <= max);
      notice.textContent = count
        ? `已选择 ${count} 类，需保持在 ${min}–${max} 类之间。`
        : `请至少选择 ${min} 类，最多选择 ${max} 类。`;
    }

    if (condition) {
      participantInput.addEventListener('input', updateFormState);
      form.addEventListener('change', updateFormState);
      updateFormState();
    }

    if (condition && window.Tracking.isTrackingMode(params)) {
      window.Tracking.renderEntry({
        form,
        participantInput,
        categoryGrid,
        notice,
        submitBtn,
        params,
        study,
        condition,
        source,
        returnUrl,
      });
    } else {
      form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!condition) return;

      await window.ExperimentStore.whenReady;

      const participantName = participantInput.value.trim();
      if (!participantName) {
        notice.textContent = '姓名为必填项，请填写后继续。';
        participantInput.focus();
        return;
      }

      const categories = selectedCategories();
      const min = condition.recommendation.minSelectedCategories;
      const max = condition.recommendation.maxSelectedCategories;
      if (categories.length < min || categories.length > max) {
        notice.textContent = `请选择 ${min}–${max} 类内容。`;
        return;
      }

      const sessionId = window.ExperimentStore.makeId('sess');
      const startAt = Date.now();
      const sessionMeta = {
        participantName,
        study,
        condition: conditionId,
        selectedCategories: categories,
        returnUrl,
      };
      const screenInfo = {
        width: window.screen.width,
        height: window.screen.height,
        devicePixelRatio: window.devicePixelRatio || 1,
      };
      const feed = window.Recommendation.buildRecommendedFeed({
        assets: window.VIDEO_ASSETS,
        selectedCategories: categories,
        feedLength: condition.browsing.feedLength,
        preferredRatio: condition.recommendation.preferredRatio,
        seed: `${sessionId}_${participantName}_${study}_${conditionId}`,
      });

      const assignedFeed = {
        id: `feed_${sessionId}`,
        sessionId,
        participantName,
        study,
        condition: conditionId,
        selectedCategories: categories,
        recommendationRule: condition.recommendation,
        videoSequence: feed.map((item) => ({
          videoId: item.id,
          sampleId: item.sample_id,
          primaryCategory: item.primary_category,
          matchedPreference: item.matched_preference,
        })),
        preferenceMatchRatio: feed.filter((item) => item.matched_preference).length / feed.length,
      };

      await Promise.all([
        window.ExperimentStore.upsert('participant_sessions', {
          id: sessionId,
          participantName,
          source,
          study,
          condition: conditionId,
          entryUrl: window.location.href,
          returnUrl,
          status: 'preference_completed',
          startedAt: startAt,
          preQuestionnaireSubmittedAt: Date.now(),
          feedStartedAt: null,
          completedAt: null,
          userAgent: navigator.userAgent,
          screen: screenInfo,
          selectedCategories: categories,
        }),
        window.ExperimentStore.upsert('preference_responses', {
          id: `pref_${sessionId}`,
          sessionId,
          participantName,
          study,
          condition: conditionId,
          selectedCategories: categories,
          selectedCategoryLabels: categories.map((id) => window.CONTENT_CATEGORIES.find((cat) => cat.id === id)?.label || id),
          minSelected: min,
          maxSelected: max,
          submittedAt: Date.now(),
        }),
        window.ExperimentStore.upsert('assigned_feeds', assignedFeed),
      ]);

      window.sessionStorage.setItem(`condition_${sessionId}`, JSON.stringify(condition));
      window.sessionStorage.setItem(`feed_${sessionId}`, JSON.stringify(feed));
      window.sessionStorage.setItem(`session_meta_${sessionId}`, JSON.stringify(sessionMeta));
      window.location.href = `runner.html?sessionId=${encodeURIComponent(sessionId)}&debug=${params.get('debug') || '0'}`;
      });
    }
  </script>
</body>
</html>
